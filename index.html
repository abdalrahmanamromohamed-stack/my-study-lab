    <!-- JAVASCRIPT ENGINE -->
    <script>
        const CONFIG = {
            groqApiKey: "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",
            supabaseUrl: "https://vrjnfxglbijjhddwjai.supabase.co",
            supabaseKey: "sb_publishable_0dm4Zkz_XsAc5UMR-nPvIw_DfdKYJ3I"
        };

        const supabaseClient = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);

        let appState = {
            lang: 'ar',
            userEmail: localStorage.getItem('athena_user_email') || 'student@athenaeum.pro',
            tasks: JSON.parse(localStorage.getItem('athena_tasks')) || [
                { id: 1, text: 'مراجعة الباب الأول كيمياء عبر Groq', day: 'الأحد', done: false },
                { id: 2, text: 'حل نموذج IELTS Speaking', day: 'الإثنين', done: true }
            ],
            extractedPdfText: ''
        };

        document.addEventListener('DOMContentLoaded', () => {
            switchWorkspace('arabic', 'اللغة العربية');
        });

        function toggleLanguage() {
            appState.lang = appState.lang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = appState.lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('lang-btn-text').innerText = appState.lang === 'ar' ? 'EN' : 'AR';
        }

        function switchWorkspace(type, title) {
            document.getElementById('workspace-title').innerText = title;
            const content = document.getElementById('workspace-content');

            document.querySelectorAll('.subject-btn').forEach(btn => {
                btn.classList.remove('active', 'text-cyan-400', 'bg-cyan-500/10', 'border-cyan-500/20');
                btn.classList.add('text-slate-300');
            });
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active', 'text-cyan-400', 'bg-cyan-500/10', 'border-cyan-500/20');
            }

            if(type === 'schedule_page') {
                renderSchedulePage(content);
            } else if(type === 'speaking') {
                renderSpeakingLab(content);
            } else if(type === 'vault_page') {
                renderVaultPage(content);
            } else {
                renderSubjectWorkspace(content, type, title);
            }
        }

        function renderSubjectWorkspace(container, subId, subTitle) {
            container.innerHTML = `
                <div class="grid grid-cols-12 gap-4">
                    <!-- PDF & PAGE RANGE SELECTOR -->
                    <div class="col-span-12 lg:col-span-5 bg-slate-800/80 border border-slate-700/60 rounded-xl p-4 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-bold text-cyan-400 uppercase"><i class="fa-solid fa-file-pdf ml-1"></i> مصدر الـ PDF</h3>
                            <span id="pdf-status" class="text-[10px] text-slate-400">لم يتم الرفع</span>
                        </div>
                        
                        <label class="border border-dashed border-cyan-500/30 hover:border-cyan-500 bg-cyan-500/5 rounded-lg p-3.5 flex flex-col items-center justify-center cursor-pointer transition">
                            <i class="fa-solid fa-cloud-arrow-up text-cyan-400 text-xl mb-1"></i>
                            <span id="pdf-file-name" class="text-xs font-bold text-cyan-400">اضغط لرفع كتاب المادة</span>
                            <input type="file" accept=".pdf" class="hidden" onchange="handleRealPdfUpload(event)">
                        </label>

                        <!-- PAGE RANGE SELECTION -->
                        <div class="space-y-1.5 bg-slate-900/40 p-2.5 rounded-lg border border-slate-700/60">
                            <label class="text-[10px] text-amber-400 font-bold block"><i class="fa-solid fa-filter ml-1"></i> نطاق الصفحات:</label>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="page-start" value="1" placeholder="من" class="bg-slate-800 border border-slate-700 rounded-md p-1.5 text-xs text-slate-200 text-center">
                                <input type="number" id="page-end" value="5" placeholder="إلى" class="bg-slate-800 border border-slate-700 rounded-md p-1.5 text-xs text-slate-200 text-center">
                            </div>
                        </div>

                        <!-- GROQ AI EXAM BUILDER -->
                        <button onclick="generateGroqQuiz('${subTitle}')" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold py-2 rounded-lg text-xs shadow transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-bolt text-[10px]"></i> توليد امتحان تفاعلي ذكي
                        </button>
                    </div>

                    <!-- QUIZ NODE WORKSPACE -->
                    <div class="col-span-12 lg:col-span-7 bg-slate-800/80 border border-slate-700/60 rounded-xl p-4 flex flex-col justify-between min-h-[320px]">
                        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                            <h3 class="text-xs font-bold text-slate-300">مساحة الأسئلة الاحترافية</h3>
                            <span class="text-[10px] text-cyan-400 font-mono">Exam Engine v2</span>
                        </div>

                        <div id="quiz-area" class="my-auto py-6 text-center space-y-2.5">
                            <div class="p-3 bg-slate-900/50 rounded-full w-12 h-12 flex items-center justify-center mx-auto border border-slate-700">
                                <i class="fa-solid fa-brain text-xl text-cyan-400 animate-pulse"></i>
                            </div>
                            <p class="text-xs text-slate-400 max-w-xs mx-auto">ارفع ملف الـ PDF واضغط "توليد امتحان" ليقوم الـ AI بإنشاء أسئلة مطابقة لنظام الامتحانات.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleRealPdfUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            document.getElementById('pdf-file-name').innerText = file.name;
            document.getElementById('pdf-status').innerText = 'جاري القراءة...';

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = async function() {
                try {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = '';
                    
                    const startP = parseInt(document.getElementById('page-start').value) || 1;
                    const endP = Math.min(parseInt(document.getElementById('page-end').value) || 5, pdf.numPages);

                    for (let i = startP; i <= endP; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += `--- Page ${i} ---\n` + pageText + '\n';
                    }

                    appState.extractedPdfText = fullText;
                    document.getElementById('pdf-status').innerText = `جاهز (${endP - startP + 1} صفحة) ✅`;
                } catch (err) {
                    document.getElementById('pdf-status').innerText = 'خطأ في القراءة ❌';
                }
            };
        }

        async function generateGroqQuiz(subTitle) {
            const area = document.getElementById('quiz-area');
            area.innerHTML = `
                <div class="py-8 space-y-2">
                    <i class="fa-solid fa-spinner fa-spin text-2xl text-cyan-400"></i>
                    <p class="text-xs text-slate-300">جاري تحليل النصوص وصياغة أسئلة امتحانات دقيقة...</p>
                </div>
            `;

            const promptContext = appState.extractedPdfText ? 
                `بناءً على النصوص التالية من المنهج:\n${appState.extractedPdfText.substring(0, 3000)}` : 
                `بناءً على المعيار الأكاديمي لمادة ${subTitle}`;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CONFIG.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are an expert Egyptian Thanaweya Amma / IELTS exam creator. Generate high-quality conceptual multiple choice questions. Return ONLY a valid JSON object with fields: question, options (array of 4 choices), correct_answer." },
                            { role: "user", content: `${promptContext}. قم بتوليد سؤال قياس الفهم واختيار من متعدد بصيغة JSON.` }
                        ]
                    })
                });

                const data = await response.json();
                let quizData;
                try {
                    let rawContent = data.choices[0].message.content;
                    rawContent = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
                    quizData = JSON.parse(rawContent);
                } catch(e) {
                    quizData = {
                        question: `سؤال قياس الفهم في ${subTitle}: ما هو المفهوم الأساسي المرتبط بالنص؟`,
                        options: ["الخيار الأول النموذجي", "مشتت أول", "مشتت ثاني", "مشتت ثالث"],
                        correct_answer: "الخيار الأول النموذجي"
                    };
                }

                area.innerHTML = `
                    <div class="text-right space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-700/60">
                        <span class="text-[9px] bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/20 font-bold">سؤال قياس الفهم الذكي</span>
                        <h4 class="text-xs font-bold text-slate-100 leading-relaxed">${quizData.question}</h4>
                        <div class="grid grid-cols-1 gap-1.5 pt-1">
                            ${quizData.options.map(opt => `
                                <button onclick="checkAnswer('${opt}', '${quizData.correct_answer}', '${subTitle}', '${quizData.question.replace(/'/g, "")}')" class="w-full text-right p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-lg text-xs transition">${opt}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (error) {
                area.innerHTML = `<p class="text-xs text-red-400">فشل الاتصال بـ Groq API.</p>`;
            }
        }

        async function checkAnswer(selected, correct, subject, questionText) {
            if(selected === correct) {
                alert('إجابة دقيقة وصحيحة يا بطل! 🌟');
            } else {
                alert(`إجابة غير صحيحة.\nالإجابة الصحيحة: ${correct}\nتم حفظ السؤال في بنك الأخطاء.`);
                try {
                    await supabaseClient.from('athena_mistakes').insert([
                        { user_email: appState.userEmail, question: questionText, subject: subject }
                    ]);
                } catch(err) {
                    console.log('Saved fallback');
                }
            }
        }

        async function renderVaultPage(container) {
            container.innerHTML = `
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 space-y-3">
                    <h3 class="text-xs font-bold text-rose-400 flex items-center gap-1.5"><i class="fa-solid fa-shield-halved"></i> بنك الأخطاء السحابي (Supabase)</h3>
                    <p class="text-[11px] text-slate-400">الأسئلة التي واجهتك وتم حفظها لتتمكن من مراجعتها لاحقاً.</p>
                    <div id="mistakes-list" class="space-y-2 pt-2">
                        <p class="text-xs text-slate-500">جاري التحميل...</p>
                    </div>
                </div>
            `;

            try {
                const { data } = await supabaseClient.from('athena_mistakes').select('*').eq('user_email', appState.userEmail);
                const list = document.getElementById('mistakes-list');
                if(data && data.length > 0) {
                    list.innerHTML = data.map(m => `
                        <div class="p-2.5 bg-slate-900/70 rounded-lg border border-slate-700/60 text-xs flex justify-between items-center gap-2">

                            <span class="text-[9px] text-slate-500 shrink-0">${new Date(m.created_at).toLocaleDateString()}</span>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `<p class="text-xs text-emerald-400">سجل بنك الأخطاء نظيف تماماً! ممتاز 🚀</p>`;
                }
            } catch(e) {
                document.getElementById('mistakes-list').innerHTML = `<p class="text-xs text-slate-400">لا توجد أخطاء مسجلة حالياً.</p>`;
            }
        }

                </div>

        }

            container.innerHTML = `
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-6 space-y-3 text-center py-10">
                    <i class="fa-solid fa-microphone-lines text-3xl text-indigo-400 animate-bounce mb-1"></i>
                    <h3 class="text-xs font-bold text-indigo-300">مختبر التحدث الذكي (IELTS Speaking Simulator)</h3>
                    <p class="text-[11px] text-slate-400 max-w-sm mx-auto">تحدث وتدرب على محادثات الـ IELTS وسيعطيك الـ AI تقييماً لأدائك.</p>
                    <button onclick="alert('جاري تفعيل محاكي الصوت...')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-lg text-xs transition">ابدأ المحادثة الصوتية</button>
                </div>
            `;
        }

        function toggleAiModal() {
            document.getElementById('ai-modal').classList.toggle('hidden');
        }

        async function sendGroqMessage() {
            const input = document.getElementById("ai-input");
            const text = input.value.trim();
            if(!text) return;

            const chatBody = document.getElementById("ai-chat-body");
            chatBody.innerHTML += `<div class="bg-slate-700 text-slate-100 p-2.5 rounded-lg max-w-[80%] mr-auto text-xs">${text}</div>`;
            input.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CONFIG.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;

                chatBody.innerHTML += `<div class="bg-amber-500/10 border border-amber-500/20 text-slate-200 p-2.5 rounded-lg max-w-[85%] text-xs leading-relaxed"><b class="text-amber-400">Groq AI:</b> ${reply}</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
            } catch (err) {
                chatBody.innerHTML += `<div class="text-red-400 text-xs">عذراً، حدث خطأ في الاتصال.</div>`;
            }
        }

        function clearAllData() {
            if(confirm("هل تريد إعادة ضبط بيانات التطبيق؟")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
